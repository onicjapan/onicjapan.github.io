    - title: AIエージェント時代のトランスポートSLIMのご紹介
      time: "18:30"
      type: BoF
      tag: b_02
      presenters:
        - name_and_title: |-
            シスコシステムズ合同会社<br />
            小倉 隆啓
          photo: placeholder-120x140.png
      abstract: |-
        今日、多くの組織でAIエージェント（Agentic AI）の構築が加速する中、分散したエージェント同士を安全かつ超低遅延で接続する「ネットワーク」の役割は、ますますその重要性を増しています。
        本セッションでは、マルチエージェント時代の新しいトランスポートとして開発されている「SLIM（Secure Low-Latency Interactive Messaging）」のアーキテクチャをご紹介します。
        SLIMが備える以下のような特徴をご紹介しながら、AIエージェント時代のネットワークについて考えてみたいと思います。

        キーワード: **プレーンの完全分離**, **IPに代わるアドレス設計**, **パケット配送の安全性**
