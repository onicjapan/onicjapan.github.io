    - title: 適産適消で実現するモビリティAI時代のグリーンコンピューティング
      time: "16:45"
      type: 講演
      tag: s_10
      presenters:
        - name_and_title: |-
            ENEOSホールディングス株式会社<br />
            原山 元希
          photo: Motoki_Harayama.jpg
      abstract: |-
        自動運転・SDV・製造AIの進展により、モビリティ分野ではデータ量および計算需要が急速に拡大している。一方で、AI計算基盤の大規模化は、電力供給、再生可能エネルギー活用、水資源、冷却方式、通信帯域などの新たな制約を顕在化させている。従来の大型データセンターへの集約型アーキテクチャだけでは、これらの課題に持続的に対応することが難しくなりつつある。

        本講演では、モビリティ分野におけるデータグラビティの概念に着目し、車両・工場・エッジ拠点・地域データセンター・セントラルデータセンターを連携させる分散コンピューティング基盤の考え方を紹介する。さらに、ワークロード特性、データ所在地、電力・再エネ状況、冷却・水資源制約を考慮して処理を最適配置する設計原則「適産適消」を提案する。

        また、GPU基盤、再生可能エネルギー、可観測性基盤、グリーンアウェア・スケジューリングを活用した分散データセンター運用の方向性を示し、日本におけるモビリティAI基盤の将来像とグリーンコンピューティング実現に向けた課題について議論する。

        キーワード: **モビリティ**, **分散データセンター**, **グリーン**
