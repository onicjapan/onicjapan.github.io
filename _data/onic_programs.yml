    - title: 量子計算理論と光量子コンピューター
      time: "10:15"
      type: 講演
      tag: s_01
      presenters:
        - name_and_title: |-
            山下技術開発事務所合同会社<br />
            山下 克司
          photo: Katsushi_Yamashita.jpg
      abstract: |-
        量子コンピューターの実用化が迫っています。先行している米企業は2029年に量子コンピューターを実用化するロードマップを発表し、日本でも東京大学との共同研究に加えて理研・富岳とのハイブリッド計算環境を構築することも決定し、量子計算の実用化に道筋をつけています。

        従来の古典コンピューターはゼロと１の論理演算理論を構成しデジタル計算を実現しています。同様に量子コンピューターは量子状態の重ね合わせを用いて量子演算理論を構成し量子計算を実現しています。

        このセミナーは、量子で扱う数を理解して量子計算理論の基礎についてわかりやすく解説します。また、現在日本が世界に先駆けて実用化に挑んでいる光量子コンピューターの動作原理について東京大学古澤研究所とNTT研究所の発表をもとに解説します。

        キーワード: **光量子コンピューター**, **量子計算理論**
